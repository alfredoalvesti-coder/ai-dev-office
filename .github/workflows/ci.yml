name: Fundação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: docker info
      - name: Testes e pacote Java, incluindo PostgreSQL real
        working-directory: backend
        run: sh mvnw --batch-mode verify
      - name: Confirmar que a integração PostgreSQL foi executada
        run: |
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('backend/target/surefire-reports/TEST-dev.aidevoffice.PostgresIntegrationTest.xml').getroot(); assert r.attrib['skipped']=='0', 'Teste PostgreSQL ignorado'"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose -f infra/compose.yml config --quiet
